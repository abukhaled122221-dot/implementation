<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>توصياتي السابقة — ثقة</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="/js/tw-config.js"></script>
    <link
      href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;900&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    />
  </head>
  <body
    class="min-h-screen bg-slate-50 font-sans text-slate-800 antialiased flex flex-col"
  >
    <header
      class="bg-white/80 backdrop-blur-md sticky top-0 z-40 border-b border-slate-100 shadow-sm"
    >
      <div
        class="max-w-5xl mx-auto px-4 h-20 flex items-center justify-between"
      >
        <a href="/" class="flex items-center gap-3">
          <span
            class="w-11 h-11 rounded-2xl bg-gradient-to-tr from-brand-600 to-brand-500 flex items-center justify-center text-white text-xl shadow-lg shadow-brand-500/20"
          >
            <i class="fa-solid fa-shield-halved"></i>
          </span>
          <span class="text-lg font-black text-navy-800"
            >ثقة للتأمين الذكي</span
          >
        </a>
        <div
          data-auth-nav
          class="flex items-center gap-2 text-xs font-bold"
        ></div>
      </div>
    </header>

    <main class="flex-grow max-w-5xl w-full mx-auto px-4 py-10">
      <div class="flex flex-wrap items-end justify-between gap-4 mb-6">
        <div>
          <h1 class="text-3xl font-black text-navy-800">توصياتي السابقة</h1>
          <p class="text-sm text-slate-500 mt-1">
            كل طلب توصية قمت به محفوظ هنا مع تفاصيله وأسبابه.
          </p>
        </div>
        <a
          href="/#recommendation"
          class="bg-brand-600 hover:bg-brand-700 text-white font-bold px-5 py-3 rounded-xl text-sm transition"
        >
          <i class="fa-solid fa-plus ml-1"></i>طلب توصية جديدة
        </a>
      </div>

      <div id="history-list" class="space-y-3"></div>
      <div
        id="history-pagination"
        class="flex items-center justify-between mt-6 text-sm"
      ></div>
    </main>

    <!-- نافذة تفاصيل الطلب -->
    <div
      id="detail-modal"
      class="hidden fixed inset-0 z-50 bg-navy-900/60 flex items-start justify-center p-4 overflow-y-auto"
    >
      <div class="bg-white rounded-3xl shadow-2xl w-full max-w-3xl my-8">
        <div
          class="flex items-center justify-between p-6 border-b border-slate-100"
        >
          <h2 id="detail-title" class="text-xl font-black text-navy-800">
            تفاصيل الطلب
          </h2>
          <button
            type="button"
            data-close-modal
            class="w-9 h-9 rounded-xl hover:bg-slate-100 text-slate-500"
          >
            <i class="fa-solid fa-xmark"></i>
          </button>
        </div>
        <div id="detail-body" class="p-6"></div>
      </div>
    </div>

    <footer class="bg-navy-900 text-slate-400 py-6 text-center text-xs">
      © 2026 منصة ثقة للتأمين الذكي
    </footer>

    <script src="/js/common.js"></script>
    <script src="/js/request-detail.js"></script>
    <script src="/js/history.js"></script>
  </body>
</html>
