<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>دخول المسؤول — ثقة</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="/js/tw-config.js"></script>
    <link
      href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;900&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    />
  </head>
  <body
    class="min-h-screen bg-navy-900 font-sans text-slate-800 antialiased flex items-center justify-center p-4"
  >
    <main class="w-full max-w-md">
      <div class="flex items-center justify-center gap-3 mb-8 text-white">
        <span
          class="w-12 h-12 rounded-2xl bg-brand-600 flex items-center justify-center text-2xl"
        >
          <i class="fa-solid fa-user-shield"></i>
        </span>
        <div>
          <div class="text-xl font-black">لوحة تحكم ثقة</div>
          <div class="text-xs text-slate-400">
            منطقة مخصصة لمسؤولي النظام فقط
          </div>
        </div>
      </div>

      <section class="bg-white rounded-3xl shadow-2xl p-8">
        <h1 class="text-2xl font-black text-navy-800 mb-6">دخول المسؤول</h1>

        <div
          id="form-error"
          class="hidden mb-4 p-3 rounded-xl bg-red-50 border border-red-100 text-red-700 text-sm font-bold"
        ></div>

        <form id="admin-login-form" class="space-y-4" novalidate>
          <div>
            <label
              for="identifier"
              class="block text-sm font-bold text-slate-700 mb-1.5"
            >
              اسم المستخدم أو البريد الإلكتروني
            </label>
            <input
              id="identifier"
              name="identifier"
              autocomplete="username"
              class="w-full px-4 py-3 rounded-xl border border-slate-200 focus:outline-none focus:ring-2 focus:ring-brand-500"
            />
          </div>
          <div>
            <label
              for="password"
              class="block text-sm font-bold text-slate-700 mb-1.5"
              >كلمة المرور</label
            >
            <input
              id="password"
              name="password"
              type="password"
              autocomplete="current-password"
              class="w-full px-4 py-3 rounded-xl border border-slate-200 focus:outline-none focus:ring-2 focus:ring-brand-500"
            />
          </div>
          <button
            type="submit"
            class="w-full bg-navy-800 hover:bg-navy-900 text-white font-black py-3.5 rounded-xl transition"
          >
            دخول لوحة التحكم <i class="fa-solid fa-arrow-left mr-1"></i>
          </button>
        </form>
      </section>

      <p class="text-center text-xs text-slate-500 mt-6">
        <a href="/" class="hover:text-slate-300"
          ><i class="fa-solid fa-arrow-right ml-1"></i>موقع ثقة للعملاء</a
        >
      </p>
    </main>

    <script src="/js/common.js"></script>
    <script>
      // دخول المسؤول منفصل تماماً عن دخول العميل (جلسة وكوكي مختلفان)
      (() => {
        const form = document.getElementById("admin-login-form");
        const errorBox = document.getElementById("form-error");

        TH.api("/api/admin/me")
          .then(() => location.replace("/admin/"))
          .catch(() => {});

        form.addEventListener("submit", async (event) => {
          event.preventDefault();
          errorBox.classList.add("hidden");
          const values = {
            identifier: form.identifier.value.trim(),
            password: form.password.value,
          };
          if (!values.identifier || !values.password) {
            errorBox.textContent = "أدخل بيانات الدخول كاملة";
            errorBox.classList.remove("hidden");
            return;
          }
          const button = form.querySelector('button[type="submit"]');
          TH.setLoading(button, true, "جارٍ التحقق…");
          try {
            await TH.api("/api/admin/login", { method: "POST", body: values });
            location.href = "/admin/";
          } catch (error) {
            errorBox.textContent = error.message;
            errorBox.classList.remove("hidden");
            TH.setLoading(button, false);
          }
        });
      })();
    </script>
  </body>
</html>
