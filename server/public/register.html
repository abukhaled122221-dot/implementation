<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>إنشاء حساب — ثقة</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="/js/tw-config.js"></script>
    <link
      href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;900&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    />
  </head>
  <body
    class="min-h-screen bg-slate-50 font-sans text-slate-800 antialiased flex items-center justify-center p-4"
  >
    <main class="w-full max-w-md py-8">
      <!-- الشعار -->
      <a href="/" class="flex items-center justify-center gap-3 mb-8">
        <span
          class="w-12 h-12 rounded-2xl bg-gradient-to-tr from-brand-600 to-brand-500 flex items-center justify-center text-white text-2xl shadow-lg shadow-brand-500/20"
        >
          <i class="fa-solid fa-shield-halved"></i>
        </span>
        <span class="text-xl font-black text-navy-800">ثقة للتأمين الذكي</span>
      </a>

      <section
        class="bg-white rounded-3xl border border-slate-100 shadow-xl shadow-slate-200/50 p-8"
      >
        <h1 class="text-2xl font-black text-navy-800">إنشاء حساب جديد</h1>
        <p class="text-sm text-slate-500 mt-1 mb-6">
          حساب واحد لحفظ توصياتك والرجوع لها في أي وقت.
        </p>

        <div
          id="form-error"
          class="hidden mb-4 p-3 rounded-xl bg-red-50 border border-red-100 text-red-700 text-sm font-bold"
        ></div>

        <form id="register-form" class="space-y-4" novalidate>
          <div>
            <label
              for="username"
              class="block text-sm font-bold text-slate-700 mb-1.5"
              >اسم المستخدم</label
            >
            <input
              id="username"
              name="username"
              autocomplete="username"
              dir="ltr"
              placeholder="ahmed_99"
              class="w-full px-4 py-3 rounded-xl border border-slate-200 text-right focus:outline-none focus:ring-2 focus:ring-brand-500 focus:border-brand-500"
            />
            <p class="text-xs text-slate-400 mt-1">
              3–30 حرفاً إنجليزياً أو أرقاماً أو ( _ . )
            </p>
            <p
              class="text-xs text-red-600 mt-1 min-h-[1rem]"
              data-error="username"
            ></p>
          </div>

          <div>
            <label
              for="email"
              class="block text-sm font-bold text-slate-700 mb-1.5"
              >البريد الإلكتروني</label
            >
            <input
              id="email"
              name="email"
              type="email"
              autocomplete="email"
              dir="ltr"
              placeholder="name@example.com"
              class="w-full px-4 py-3 rounded-xl border border-slate-200 text-right focus:outline-none focus:ring-2 focus:ring-brand-500 focus:border-brand-500"
            />
            <p
              class="text-xs text-red-600 mt-1 min-h-[1rem]"
              data-error="email"
            ></p>
          </div>

          <div>
            <label
              for="password"
              class="block text-sm font-bold text-slate-700 mb-1.5"
              >كلمة المرور</label
            >
            <div class="relative">
              <input
                id="password"
                name="password"
                type="password"
                autocomplete="new-password"
                class="w-full pl-12 pr-4 py-3 rounded-xl border border-slate-200 focus:outline-none focus:ring-2 focus:ring-brand-500 focus:border-brand-500"
              />
              <button
                type="button"
                data-toggle-password="password"
                class="absolute left-3 top-1/2 -translate-y-1/2 text-slate-400 hover:text-slate-600"
                aria-label="إظهار كلمة المرور"
              >
                <i class="fa-solid fa-eye"></i>
              </button>
            </div>
            <!-- مؤشر قوة كلمة المرور -->
            <ul id="password-rules" class="text-xs mt-2 space-y-1">
              <li data-rule="length" class="text-slate-400">
                <i class="fa-solid fa-circle-check ml-1"></i>8 أحرف على الأقل
              </li>
              <li data-rule="letter" class="text-slate-400">
                <i class="fa-solid fa-circle-check ml-1"></i>حرف إنجليزي واحد
                على الأقل
              </li>
              <li data-rule="digit" class="text-slate-400">
                <i class="fa-solid fa-circle-check ml-1"></i>رقم واحد على الأقل
              </li>
            </ul>
            <p
              class="text-xs text-red-600 mt-1 min-h-[1rem]"
              data-error="password"
            ></p>
          </div>

          <div>
            <label
              for="confirm_password"
              class="block text-sm font-bold text-slate-700 mb-1.5"
            >
              تأكيد كلمة المرور
            </label>
            <input
              id="confirm_password"
              name="confirm_password"
              type="password"
              autocomplete="new-password"
              class="w-full px-4 py-3 rounded-xl border border-slate-200 focus:outline-none focus:ring-2 focus:ring-brand-500 focus:border-brand-500"
            />
            <p
              class="text-xs text-red-600 mt-1 min-h-[1rem]"
              data-error="confirm_password"
            ></p>
          </div>

          <button
            type="submit"
            class="w-full bg-brand-600 hover:bg-brand-700 text-white font-black py-3.5 rounded-xl transition shadow-lg shadow-brand-500/20"
          >
            إنشاء الحساب <i class="fa-solid fa-user-plus mr-1"></i>
          </button>
        </form>

        <p class="text-sm text-center text-slate-500 mt-6">
          لديك حساب؟
          <a
            id="login-link"
            href="/login.html"
            class="font-bold text-brand-700 hover:underline"
            >تسجيل الدخول</a
          >
        </p>
      </section>

      <p class="text-center text-xs text-slate-400 mt-6">
        <a href="/" class="hover:text-slate-600"
          ><i class="fa-solid fa-arrow-right ml-1"></i>العودة للرئيسية</a
        >
      </p>
    </main>

    <script src="/js/common.js"></script>
    <script src="/js/auth.js"></script>
  </body>
</html>
